name: Debian Package

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the built packages as a GitHub pre-release (branch refs only)'
        type: boolean
        default: false

# Pushes and pull requests only build the packages and upload them as
# workflow artifacts. A v* tag is released by release.yml, which owns the
# release and its (hand-edited, initially empty) body; this workflow never
# creates or edits that release. The only write-scoped job is the opt-in
# manual pre-release below.
permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper-compat devscripts dpkg-dev \
            cmake libevent-dev libssl-dev \
            golang-go ninja-build perl

      - name: Build Debian packages
        run: dpkg-buildpackage -us -uc -b -j$(nproc) -Zxz

      - name: Collect packages
        run: |
          mkdir -p dist
          mv ../*.deb dist/
          ls -lh dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 30

  release:
    name: Publish GitHub pre-release
    needs: build-deb
    # Manual opt-in only, and never for a tag: release.yml owns tag releases.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.create_release &&
      !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 packages
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: dist/amd64

      - name: Download arm64 packages
        uses: actions/download-artifact@v4
        with:
          name: deb-arm64
          path: dist/arm64

      - name: List packages
        run: find dist/ -name '*.deb' | sort

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          TAG="${SAFE_REF}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          # --target: without it gh tags the default branch, not this build.
          # Pre-release and not latest, so it never displaces the current
          # stable release. Body intentionally empty (edited by hand).
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "mqvpn $TAG" \
            --prerelease \
            --latest=false \
            --notes "" \
            dist/amd64/*.deb \
            dist/arm64/*.deb
